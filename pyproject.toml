[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "okul-yonetim-sistemi"
version = "1.1.0"
description = "Nöbet, sınav, ders programı ve öğrenci takibi için Django tabanlı okul yönetim sistemi."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
okulyonetim-kur = "kurulumcu.cli:main"

[tool.setuptools]
packages = ["kurulumcu"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "W", "I"]
