<div class="table-responsive"><table class="table">
    <thead><tr><th>Tarih</th><th>Saat</th><th>Kurul</th><th>Yer</th><th>Durum</th></tr></thead>
    <tbody>
    {% for t in liste %}
    <tr>
        <td>{{ t.tarih|date:"d.m.Y l" }}</td><td>{{ t.saat|time:"H:i" }}</td>
        <td><a href="{% url 'kurul:toplanti_detay' t.pk %}">{{ t.kurul.ad }} — {{ t.no }}. toplantı</a></td>
        <td>{{ t.yer }}</td><td><span class="tp-durum tp-{{ t.durum }}">{{ t.get_durum_display }}</span></td>
    </tr>
    {% empty %}<tr><td colspan="5" class="text-muted">Kayıt yok.</td></tr>{% endfor %}
    </tbody>
</table></div>
